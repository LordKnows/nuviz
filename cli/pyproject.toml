# Packages the `nuviz` binary as a Python wheel, so the CLI can be installed
# with pip next to the logger:
#
#     pip install "nuviz[cli]"
#
# The pure-Python logger lives in ../python and stays dependency-free; this
# package contains only the compiled command-line tool.

[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "nuviz-cli"
description = "Terminal-native ML training visualization CLI (prebuilt binary)"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Zhongyuan" }]
keywords = ["ml", "visualization", "terminal", "tui", "training"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/LordKnows/nuviz"
Repository = "https://github.com/LordKnows/nuviz"
Issues = "https://github.com/LordKnows/nuviz/issues"

[tool.maturin]
bindings = "bin"
strip = true
